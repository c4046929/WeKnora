name: Evaluation regression

on:
  pull_request:
    paths:
      - 'cmd/evalgate/**'
      - 'evaluation/**'
      - 'internal/application/service/evaluation*'
      - 'internal/application/service/metric/**'
      - 'internal/models/chat/**'
      - 'internal/types/evaluation.go'
      - 'internal/types/llm_observability.go'
      - '.github/workflows/evaluation-regression.yml'
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test evaluation metrics and gate
        run: go test ./internal/application/service/metric ./cmd/evalgate
      - name: Verify checked-in regression fixture
        run: >-
          go run ./cmd/evalgate
          -result evaluation/fixtures/regression_result.json
          -baseline evaluation/baseline.json
          -report evaluation-report.json
      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-regression-report
          path: evaluation-report.json
          if-no-files-found: warn
